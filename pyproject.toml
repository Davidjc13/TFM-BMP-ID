[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmpid"
version = "0.1.0"
description = "Autenticación conductual móvil (tecdeo, firma, scroll) — open-set"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0.1",
  "pyarrow>=14.0.0",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
torch = ["torch>=2.2.0"]
dev = ["pytest>=7.4.0"]
# readme omitted: root README is the TFM title page, not package docs

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
